name: CI

on:
  push:
    branches: [D]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Run unittests
        run: dub test --compiler=ldc2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check documentation examples
        run: python tools/doctest.py

      # - name: Build static library
      #   run: dub build --config=library --compiler=ldc2

  wasi:
    name: wasm32-wasi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Run unittests and example under @tybys/wasm-util
        run: python3 tools/wasi.py --node
